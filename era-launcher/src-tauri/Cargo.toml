[package]
name = "era-launcher"
version = "0.1.0"
description = "A modern Minecraft launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "era_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "trust-dns", "stream"] }
tokio = { version = "1.40", features = ["full"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
futures = "0.3"
zip = "0.6"
image = { version = "0.25", features = ["webp", "png", "jpeg"] }
base64 = "0.22"
oauth2 = "4.4"
rand = "0.8"
once_cell = "1"
