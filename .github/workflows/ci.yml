name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Test
        run: python -m pytest tests/ -q --no-header

      - name: Verify test count
        run: |
          result=$(python -m pytest tests/ -q --no-header 2>&1 | tail -1)
          echo "$result"

  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build --wheel --sdist

      - name: Verify package contents
        run: |
          python -c "import zipfile, sys, glob; \
          wheels = glob.glob('dist/*.whl'); \
          assert wheels, 'No wheel found'; \
          z = zipfile.ZipFile(wheels[0]); \
          names = z.namelist(); \
          assert any(n.startswith('agentcore/') for n in names), 'agentcore package missing'; \
          assert 'agentcore/__init__.py' in names, 'Missing __init__.py'; \
          assert any('py.typed' in n for n in names), 'Missing py.typed marker'; \
          print('Package validation passed')"

  cli-smoke-test:
    name: CLI Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CLI help works
        run: |
          argus --help
          argus task --help 2>&1 || true
          argus memory --help 2>&1 || true

      - name: AgentCore imports cleanly
        run: python -c "import agentcore; print(f'agentcore {agentcore.__version__} imported')"

      - name: Training pipeline imports cleanly
        run: python -c "from agentcore.training import build_dataset, DatasetBuilder, QualityScorer; print('Training pipeline imports OK')"

      - name: Graceful degradation without db-obsidian
        run: |
          python -c "
          from agentcore.cli.service import create_ephemeral_query_service
          svc = create_ephemeral_query_service()
          assert svc.memory_backend is not None
          from agentcore.memory import MemoryBackend, InMemoryBackend
          assert isinstance(svc.memory_backend, MemoryBackend), \
              'Memory backend must implement MemoryBackend'
          try:
              from agentcore.adapters.memory_dbobsidian import DBObsidianBackend
              backend_type = 'DBObsidian' if isinstance(svc.memory_backend, DBObsidianBackend) else 'InMemory'
          except ImportError:
              assert isinstance(svc.memory_backend, InMemoryBackend), \
                  'Should fall back to InMemoryBackend when db-obsidian unavailable'
              backend_type = 'InMemory (fallback)'
          print(f'Graceful degradation: OK (backend={backend_type})')
          "

  git-diff-check:
    name: git diff --check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          if git diff --check -- .; then
            echo "No trailing whitespace found"
          else
            echo "FAIL: Trailing whitespace detected"
            exit 1
          fi
