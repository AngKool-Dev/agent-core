[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
description = "Universal AI coding-agent framework with pluggable runtime adapters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "AgentCore Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
]
db-obsidian = [
    "db-obsidian",
]

[project.scripts]
agent = "agentcore.cli.main:main"

[project.urls]
Homepage = "https://github.com/agentcore/agent-core"
Repository = "https://github.com/agentcore/agent-core"
Documentation = "https://github.com/agentcore/agent-core#readme"
Issues = "https://github.com/agentcore/agent-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcore*"]
exclude = ["tests*", "config*", "docs*", "examples*"]

[tool.setuptools.package-data]
agentcore = ["py.typed"]
