[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
description = "Universal AI coding-agent framework with pluggable runtime adapters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AgentCore Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "ruff>=0.6",
    "build>=1.0",
]
db-obsidian = [
    "db-obsidian @ git+https://github.com/AngKool-Dev/db-obsidian",
]

[project.scripts]
agent = "agentcore.cli.main:main"
argus = "agentcore.cli.main:argus_main"

[project.urls]
Homepage = "https://github.com/AngKool-Dev/agent-core"
Repository = "https://github.com/AngKool-Dev/agent-core"
Documentation = "https://github.com/AngKool-Dev/agent-core#readme"
Issues = "https://github.com/AngKool-Dev/agent-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcore*"]
exclude = ["tests*", "config*", "docs*", "examples*"]

[tool.setuptools.package-data]
agentcore = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_runtime: marks tests that require a real runtime binary (Hermes, Kilo, OpenCode)",
]
