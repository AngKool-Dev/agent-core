[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
description = "Universal AI coding-agent framework with pluggable runtime adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "tomli_w>=1.0; python_version >= '3.10'",
    "prompt_toolkit>=3.0",
]

[project.scripts]
agent = "agentcore.cli.main:main"
argus = "argus.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]