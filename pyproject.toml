[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
description = "Universal AI coding-agent framework with pluggable runtime adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytoml>=0.10.3",
]

[project.scripts]
agent = "agentcore.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]