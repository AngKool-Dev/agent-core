# ============================================================
#  SkillForge - Deep Crafting Specialization with Mastery Trees
#
#  Specializations define craft domains. Each has a skill tree
#  organized by tier. Players level by crafting XP; higher tiers
#  unlock more skills and the ability to produce signature items
#  (items with persistent NBT lore/signature).
#
#  Cross-plugin bonuses:
#    - EchoRealms: echo-attuned players get +15% XP per craft
#    - MobEcology: rare drops (amethyst, artifact, netherite, diamond) give +25% XP
#    - ChunkSovereignty: players in claimed chunks get +20% XP multiplier
#    - SovereignEconomy: crafting costs paid in sovereigns via Vault
# ============================================================

currency:
  symbol: S

storage:
  autosave-seconds: 300

vault:
  enabled: true

economy:
  apprentiship-fee: 250
  master-cut: 0.10
  crafting-base-cost: 50
  grandmaster-premium: 0.50

bonuses:
  echo-attune-xp: 0.15
  ecology-rare-drop-xp: 0.25
  claim-workshop-bonus: 0.20

specializations:
  blacksmith:
    name: Blacksmith
    description: Forge weapons, armor, and metalwork of unmatched durability.
    color: '&6'
    max-apprentices: 3
    starter-skills:
      - forge-fundamentals
      - heat-management
      - hammer-precision

  enchanter:
    name: Enchanter
    description: Bind enchantments and cosmic energy into items with precision.
    color: '&5'
    max-apprentices: 2
    starter-skills:
      - rune-basics
      - mana-weaving
      - sigil-painting

  architect:
    name: Architect
    description: Shape ender pearls, sculk, and building materials into masterpieces.
    color: '&3'
    max-apprentices: 4
    starter-skills:
      - spatial-awareness
      - block-fusion
      - design-principles

  herbalist:
    name: Herbalist
    description: Brew potions, cultivate rare plants, and distill essences.
    color: '&a'
    max-apprentices: 2
    starter-skills:
      - herb-identification
      - mortar-grinding
      - essence-extraction

  artisan:
    name: Artisan
    description: General craft mastery across multiple disciplines.
    color: '&e'
    max-apprentices: 3
    starter-skills:
      - multi-tool
      - materials-science
      - finishing-touches

