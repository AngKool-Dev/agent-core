# Prime Authentication Plugin Configuration
# Separates premium accounts from cracked accounts with SQLite-backed sessions.

database:
  # SQLite database file (relative to plugin data folder)
  file: prime.db
  # Connection pool settings
  max-connections: 10

auth:
  # Cracked players must authenticate; premium players get auto-login.
  require-auth: true
  # Seconds before an unauthenticated cracked player is kicked
  auth-timeout: 120
  # Allow premium players to bypass cracked auth entirely
  premium-bypass: true
  # Minimum password length
  min-password-length: 6
  # Max login attempts before temporary kick
  max-attempts: 5
  # Lockout duration in seconds after max failed attempts
  lockout-seconds: 300

sessions:
  # Remember cracked players for this many seconds (0 = no session)
  session-ttl: 86400
  # Auto-login premium players on join if previously authenticated
  auto-login-premium: true

messages:
  register-success: "&aAccount registered successfully. You are now logged in."
  register-failed: "&cRegistration failed: {reason}"
  login-success: "&aLogin successful. Welcome back, {player}."
  login-failed: "&cLogin failed: {reason}"
  already-logged-in: "&cYou are already authenticated."
  not-registered: "&cNo account found. Use /register <password> to create one."
  password-changed: "&aPassword changed successfully."
  password-mismatch: "&cPasswords do not match."
  password-too-short: "&cPassword must be at least {min} characters."
  auth-required: "&cPlease authenticate with /login <password>"
  premium-welcome: "&aPremium account detected. Welcome, {player}!"
  session-restored: "&aSession restored. Welcome back, {player}!"
  locked-out: "&cToo many failed attempts. Try again in {seconds} seconds."
  unregister-success: "&cYour account has been unregistered."
  status-premium: "&ePremium account"
  status-cracked: "&eCracked account &7(authenticated)"
  status-unknown: "&eCracked account &7(not authenticated)"
